<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Supervisor">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <title>Supervisor</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="/vendor/codemirror/theme/material-darker.css">
  <link rel="stylesheet" href="/vendor/codemirror/addon/dialog/dialog.css">
  <link rel="stylesheet" href="/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/vendor/highlight/atom-one-dark.css">
</head>
<body>
<div id="restart-banner" class="restart-banner" hidden></div>
<div class="app" id="app">
  <header class="app-header">
    <button class="btn ghost icon" id="menu-btn" aria-label="Menu" hidden></button>
    <h1>
      <span class="logo" id="brand-logo"></span>
      <span id="page-title">Supervisor</span>
    </h1>
    <div class="actions">
      <span id="connection-dot" class="badge dot" style="color: var(--text-3)" title="Connection status">offline</span>
      <span id="latency-badge" class="badge mono" title="WebSocket round-trip latency" hidden>—</span>
      <button class="btn ghost icon" id="header-action-1" hidden></button>
      <button class="btn ghost icon" id="header-action-2" hidden></button>
      <button class="btn ghost icon" id="help-btn" title="Request a change (?)" aria-label="Request a change"></button>
    </div>
  </header>

  <main class="app-main" id="main">
    <div class="empty">
      <div class="skel" style="width:64px;height:64px;border-radius:16px"></div>
      <p class="muted">Loading…</p>
    </div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Primary">
    <a href="#claude"    data-tab="claude"    data-icon="sparkles" data-label="Claude"></a>
    <a href="#files"     data-tab="files"     data-icon="folder"   data-label="Files"></a>
    <a href="#console"   data-tab="console"   data-icon="terminal" data-label="Console"></a>
    <a href="#system"    data-tab="system"    data-icon="cpu"      data-label="System"></a>
    <a href="#settings"  data-tab="settings"  data-icon="settings" data-label="Settings"></a>
  </nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="sheet-root"></div>

<script src="/icons.js"></script>
<script src="/components/toast.js"></script>
<script src="/components/modal.js"></script>
<script src="/components/sheet.js"></script>
<script src="/components/util.js"></script>
<script src="/components/sparkline.js"></script>
<script src="/components/dirpicker.js"></script>
<script src="/views/interactive.js"></script>
<script src="/views/sessions.js"></script>
<script src="/views/files.js"></script>
<script src="/views/console.js"></script>
<script src="/views/processes.js"></script>
<script src="/views/system.js"></script>
<script src="/views/system-combined.js"></script>
<script src="/views/settings.js"></script>
<script src="/app.js"></script>
</body>
</html>
