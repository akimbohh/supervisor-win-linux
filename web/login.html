<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Supervisor — Sign in</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/icons.js" defer></script>
</head>
<body>
<div class="login-shell">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="login-logo" id="login-logo"></div>
    <h1 class="login-title">Supervisor</h1>
    <p class="login-sub">Sign in to your remote control panel.</p>

    <div class="field">
      <label for="password">Password</label>
      <div class="row" style="position:relative">
        <input type="password" id="password" class="input" autocomplete="current-password" autofocus required>
        <button type="button" class="btn ghost icon" id="toggle-vis" title="Show/hide" tabindex="-1" style="position:absolute;right:4px"></button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <label class="row" style="cursor:pointer;color:var(--text-2);font-size:13px">
      <span class="checkbox" id="trust-cb"></span>
      <input type="checkbox" id="trusted" hidden>
      <span>Trust this device for 60 days</span>
    </label>

    <button type="submit" class="btn primary" id="submit" style="margin-top:4px">
      <span id="submit-label">Sign in</span>
    </button>
  </form>
</div>

<script>
  function $(s){return document.querySelector(s);}
  function ensureIcon(){
    if (typeof window.icon !== 'function') return setTimeout(ensureIcon, 30);
    $('#login-logo').innerHTML = window.icon('layers', { size: 22 });
    $('#toggle-vis').innerHTML = window.icon('eye', { size: 16 });
  }
  ensureIcon();

  const cb = $('#trust-cb'), inp = $('#trusted');
  cb.addEventListener('click', () => { inp.checked = !inp.checked; cb.classList.toggle('checked', inp.checked); });

  $('#toggle-vis').addEventListener('click', () => {
    const p = $('#password');
    p.type = p.type === 'password' ? 'text' : 'password';
    $('#toggle-vis').innerHTML = window.icon(p.type === 'password' ? 'eye' : 'eye-off', { size: 16 });
  });

  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = $('#password').value;
    const trusted = $('#trusted').checked;
    const btn = $('#submit'), lbl = $('#submit-label');
    btn.disabled = true; lbl.textContent = 'Signing in…';
    $('#err').textContent = '';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, trusted }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Sign-in failed');
      // Redirect to where we came from, or home.
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/';
    } catch (err) {
      $('#err').textContent = err.message;
    } finally {
      btn.disabled = false; lbl.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
