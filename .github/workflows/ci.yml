name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # node-pty is optional and needs build tools; skip it in CI. The app is
      # designed to run without it (piped fallback), and nothing under test
      # requires it.
      - run: npm ci --no-audit --no-fund
      - name: Syntax check every server file
        shell: bash
        run: for f in $(find server -name '*.js'); do node --check "$f"; done
      - run: npm run lint
      - run: npm test
