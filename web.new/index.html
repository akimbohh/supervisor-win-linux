<!doctype html>
<html lang="en" data-theme="dark" data-accent="amber" data-density="dense" data-aurora="on" data-layout="tabbar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supervisor">
<meta name="mobile-web-app-capable" content="yes">
<title>Supervisor</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>
  /* Production shell: full-bleed PWA, no device frame */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg-0);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #root {
    width: 100vw;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  @media (min-width: 900px) {
    body { background: radial-gradient(circle at 50% 0%, #14141c, #050507 60%); }
    #root {
      max-width: 1280px;
      margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,.04);
      border-right: 1px solid rgba(255,255,255,.04);
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Imperative-API roots: live outside the React tree so modal/toast/sheet
     can be opened from any view without prop-drilling refs. -->
<div id="modal-root" aria-live="polite"></div>
<div id="toasts" aria-live="polite"></div>
<div id="sheet-root" aria-live="polite"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Foundation: icon paths, utilities, modal/toast/sheet, WS client.
     Order matters: util uses window.icon; modal/toast use window.icon and
     window.el; ws uses window.api. -->
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="util.jsx"></script>
<script type="text/babel" src="modal.jsx"></script>
<script type="text/babel" src="toast.jsx"></script>
<script type="text/babel" src="sheet.jsx"></script>
<script type="text/babel" src="ws.jsx"></script>

<!-- Views: tweaks panel, sessions, files+console+procs+system+settings, app shell. -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="view-sessions.jsx"></script>
<script type="text/babel" src="view-others.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  // SW registration mirrors web/app.js: periodic update check every 5min,
  // skipWaiting on install, reload-on-controllerchange (deduplicated).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        setInterval(() => { try { reg.update(); } catch (e) {} }, 5 * 60 * 1000);
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              sw.postMessage('skipWaiting');
            }
          });
        });
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return; reloaded = true; location.reload();
        });
      }).catch(() => {});
    });
  }
  // Global error → toast (silently fails if toast system not yet loaded).
  window.addEventListener('error', (e) => {
    try { window.toast && window.toast.error((e.error && e.error.message) || e.message || 'Script error'); } catch (_) {}
    console.error('[window.error]', e.error || e.message, e.filename + ':' + e.lineno);
  });
  window.addEventListener('unhandledrejection', (e) => {
    try { window.toast && window.toast.error('Unhandled: ' + ((e.reason && e.reason.message) || String(e.reason))); } catch (_) {}
    console.error('[unhandledrejection]', e.reason);
  });
</script>
</body>
</html>
