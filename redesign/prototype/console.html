<!doctype html>
<html lang="en" data-theme="dark" data-accent="amber" data-machine="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Console — Supervisor</title>
<style>
/* Supervisor — Instrument design system (prototype build)
   Tokens per docs/design/SYSTEM.md. Dark root; light via [data-theme=light]. */
:root{
  --bg:#0a0a0a; --surface-1:#141414; --surface-2:#1c1c1c; --surface-3:#242424;
  --overlay:#181818; --border:#2a2a2a; --border-soft:#1f1f1f; --border-strong:#3a3a3a;
  --scrim:rgb(0 0 0/.6);
  --text:#ededed; --text-2:#a6a6a6; --text-3:#787878; --text-4:#4a4a4a;
  --ok:#4ade80; --ok-soft:#4ade801f; --warn:#fbbf24; --warn-soft:#fbbf241f;
  --danger:#f87171; --danger-soft:#f871711f; --info:#7dd3fc; --info-soft:#7dd3fc1f;
  --sh-1:none; --sh-3:0 12px 32px rgb(0 0 0/.5); --sh-4:0 8px 24px rgb(0 0 0/.45);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --r-sm:6px; --r:8px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --header-h:56px; --tabbar-h:58px; --rail-w:216px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.4,0,.2,1); --ease-sheet:cubic-bezier(.32,.72,.24,1);
  --t-fast:90ms; --t:150ms; --t-slow:220ms;
}
:root[data-accent="amber"]{--accent:#f5a623;--accent-text:#f5b445;--accent-on:#201302;--accent-soft:#f5a62324;}
:root[data-accent="teal"]{--accent:#2dd4bf;--accent-text:#4adec9;--accent-on:#02201c;--accent-soft:#2dd4bf24;}
:root[data-accent="purple"]{--accent:#a78bfa;--accent-text:#b7a2fb;--accent-on:#170f33;--accent-soft:#a78bfa24;}
:root[data-accent="blue"]{--accent:#5ea8ff;--accent-text:#78b6ff;--accent-on:#061731;--accent-soft:#5ea8ff24;}
:root[data-accent="rose"]{--accent:#fb7185;--accent-text:#fc8a9b;--accent-on:#310711;--accent-soft:#fb718524;}
:root[data-theme="light"]{
  --bg:#faf9f5; --surface-1:#ffffff; --surface-2:#f2f0ea; --surface-3:#e8e5dd;
  --overlay:#ffffff; --border:#dedbd3; --border-soft:#e8e5dd; --border-strong:#c4c1b9;
  --scrim:rgb(30 28 20/.4);
  --text:#171717; --text-2:#565452; --text-3:#88857f; --text-4:#c2bfb8;
  --ok:#15803d; --ok-soft:#15803d1a; --warn:#a16207; --warn-soft:#a162071a;
  --danger:#b91c1c; --danger-soft:#b91c1c1a; --info:#0369a1; --info-soft:#0369a11a;
  --sh-1:0 1px 2px rgb(30 28 20/.06); --sh-3:0 12px 32px rgb(30 28 20/.18); --sh-4:0 8px 24px rgb(30 28 20/.16);
}
:root[data-theme="light"][data-accent="amber"]{--accent:#b06000;--accent-text:#8a4c00;--accent-on:#fff;--accent-soft:#b060001a;}
:root[data-theme="light"][data-accent="teal"]{--accent:#0f766e;--accent-text:#0d6a63;--accent-on:#fff;--accent-soft:#0f766e1a;}
:root[data-theme="light"][data-accent="purple"]{--accent:#6d4fd8;--accent-text:#5f42c4;--accent-on:#fff;--accent-soft:#6d4fd81a;}
:root[data-theme="light"][data-accent="blue"]{--accent:#175fcc;--accent-text:#1355b8;--accent-on:#fff;--accent-soft:#175fcc1a;}
:root[data-theme="light"][data-accent="rose"]{--accent:#c22047;--accent-text:#ad1c3f;--accent-on:#fff;--accent-soft:#c220471a;}

/* Machine identity — hue + texture. data-machine on <html>. */
:root[data-machine="desktop"]{--machine-hue:210;--machine-name:'HELIOS';}
:root[data-machine="vps"]{--machine-hue:140;}
:root{--machine-ink:oklch(.78 .09 var(--machine-hue,210));--machine-wash:oklch(.45 .06 var(--machine-hue,210)/.16);}
:root[data-theme="light"]{--machine-ink:oklch(.45 .09 var(--machine-hue,210));--machine-wash:oklch(.55 .07 var(--machine-hue,210)/.14);}
/* Patterns render on body::before */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;}
:root[data-machine="desktop"] body::before{
  background-image:radial-gradient(var(--machine-wash) 1px,transparent 1.5px);
  background-size:22px 22px;}
:root[data-machine="vps"] body::before{
  background-image:
    linear-gradient(var(--machine-wash) 1.5px,transparent 1.5px),
    linear-gradient(90deg,var(--machine-wash) 1.5px,transparent 1.5px);
  background-size:28px 28px,28px 28px;
  background-position:0 0,0 0;
  -webkit-mask-image:radial-gradient(6px 6px at 0 0,#000 99%,transparent),radial-gradient(6px 6px at 28px 28px,#000 99%,transparent);
  -webkit-mask-size:28px 28px; mask-image:radial-gradient(6px 6px at 0 0,#000 99%,transparent);mask-size:28px 28px;}

/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font);font-size:14px;line-height:1.45;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button,input,textarea,select{font:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;padding:0;}
a{color:var(--accent-text);text-decoration:none;}
a:hover{text-decoration:underline;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--r-sm);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px;border:2px solid transparent;background-clip:content-box;}
.mono{font-family:var(--mono);}
.tabular{font-variant-numeric:tabular-nums;}
.muted{color:var(--text-2);}
.subtle{color:var(--text-3);font-size:12px;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.row{display:flex;align-items:center;gap:8px;}
.col{display:flex;flex-direction:column;gap:8px;}
.spacer{flex:1 1 auto;}
.hidden{display:none!important;}
svg{flex-shrink:0;}

/* ── Shell layout ── */
.app{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:100dvh;position:relative;z-index:1;}
.app-header{display:flex;align-items:center;gap:10px;padding:0 12px;padding-top:var(--safe-top);
  height:calc(var(--header-h) + var(--safe-top));border-bottom:1px solid var(--border);
  background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:40;}
.app-main{overflow:auto;padding:14px;padding-bottom:calc(16px + var(--safe-bot));min-height:0;position:relative;}
.tabbar{display:flex;align-items:stretch;border-top:1px solid var(--border);
  background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding-bottom:var(--safe-bot);height:calc(var(--tabbar-h) + var(--safe-bot));position:sticky;bottom:0;z-index:40;}
.tabbar a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:10px;font-weight:500;position:relative;min-height:44px;transition:color var(--t) var(--ease);}
.tabbar a:hover{text-decoration:none;color:var(--text-2);}
.tabbar a svg{width:20px;height:20px;}
.tabbar a.active{color:var(--accent-text);}
.tabbar a.active::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--accent);border-radius:0 0 2px 2px;}
@media (min-width:768px){
  .app{grid-template-columns:var(--rail-w) 1fr;grid-template-rows:auto 1fr;
    grid-template-areas:"header header" "rail main";}
  .app-header{grid-area:header;padding:0 16px;}
  .app-main{grid-area:main;padding:24px;max-width:1280px;}
  .tabbar{grid-area:rail;flex-direction:column;align-items:stretch;border-top:0;border-right:1px solid var(--border);
    padding:12px 8px;height:auto;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;}
  .tabbar a{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;font-size:13px;border-radius:var(--r);margin:1px 0;}
  .tabbar a:hover{background:var(--surface-2);color:var(--text);}
  .tabbar a.active{background:var(--accent-soft);color:var(--accent-text);}
  .tabbar a.active::before{display:none;}
}

/* Machine identity block (header) */
.machine-chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;min-height:40px;border:1px solid color-mix(in oklab,var(--machine-ink) 45%,var(--border));border-radius:var(--r);
  background:color-mix(in oklab,var(--machine-ink) 9%,transparent);cursor:pointer;transition:background var(--t) var(--ease);}
.machine-chip:hover{background:color-mix(in oklab,var(--machine-ink) 16%,transparent);}
.machine-chip .swatch{width:22px;height:22px;border-radius:5px;border:1px solid var(--machine-ink);position:relative;overflow:hidden;flex-shrink:0;}
.machine-chip .swatch::before{content:'';position:absolute;inset:0;}
.swatch.pat-dots::before{background-image:radial-gradient(var(--machine-ink) 1px,transparent 1.4px);background-size:6px 6px;background-position:2px 2px;}
.swatch.pat-grid::before{background-image:linear-gradient(var(--machine-ink) 1px,transparent 1px),linear-gradient(90deg,var(--machine-ink) 1px,transparent 1px);background-size:7px 7px;opacity:.8;}
.machine-chip .mname{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--machine-ink);letter-spacing:.02em;line-height:1.2;}
.machine-chip .mplat{font-size:10px;color:var(--text-3);line-height:1.2;}
.machine-chip svg.caret{width:14px;height:14px;color:var(--text-3);}
.app-title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px;}
.header-actions{margin-left:auto;display:flex;gap:4px;align-items:center;}

/* Connection pill */
.conn{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--r-pill);
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;border:1px solid var(--border);color:var(--text-2);background:var(--surface-1);}
.conn .d{width:7px;height:7px;border-radius:50%;background:var(--ok);}
.conn.warn .d{background:var(--warn);} .conn.bad .d{background:var(--danger);}
.conn.stale{color:var(--text-3);} .conn.stale .d{background:var(--text-4);}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;min-height:36px;
  border-radius:var(--r);border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text);background:var(--surface-2);
  transition:background var(--t) var(--ease),border-color var(--t) var(--ease),transform var(--t-fast) var(--ease);white-space:nowrap;user-select:none;}
.btn:hover{background:var(--surface-3);border-color:var(--border-strong);}
.btn:active{transform:scale(.98);}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;}
.btn svg{width:16px;height:16px;}
.btn.primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent);font-weight:600;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2);}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);}
.btn.danger{color:var(--danger);}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);}
.btn.danger.primary{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn.icon{padding:0;width:36px;height:36px;}
@media (pointer:coarse){.btn.icon{width:44px;height:44px;}.btn{min-height:44px;}}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px;}
.btn.sm.icon{width:30px;height:30px;padding:0;}
.btn.sm svg{width:14px;height:14px;}
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);padding:2px;gap:2px;}
.seg button{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-2);min-height:28px;}
.seg button:hover{color:var(--text);}
.seg button.active{background:var(--surface-3);color:var(--text);}

/* Capability-disabled control */
.cap-off{display:flex;flex-direction:column;gap:4px;min-width:0;}
.cap-off .cap-reason{font-size:12px;color:var(--text-3);line-height:1.4;}

/* ── Inputs ── */
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field>label{font-size:12px;color:var(--text-2);font-weight:500;}
.field>.help{font-size:12px;color:var(--text-3);}
.input,.textarea,.select{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);
  padding:8px 12px;min-height:38px;color:var(--text);outline:none;font-size:14px;width:100%;appearance:none;
  transition:border-color var(--t) var(--ease);}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);}
.input::placeholder,.textarea::placeholder{color:var(--text-3);}
.textarea{min-height:76px;resize:vertical;font-family:var(--mono);font-size:13px;}
.search-wrap{position:relative;flex:1;min-width:0;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3);pointer-events:none;}
.search-wrap .input{padding-left:32px;}
.toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle .knob{position:absolute;inset:0;cursor:pointer;background:var(--surface-3);border-radius:22px;border:1px solid var(--border);transition:background var(--t) var(--ease);}
.toggle .knob::before{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--text-2);border-radius:50%;transition:transform var(--t) var(--ease),background var(--t) var(--ease);}
.toggle input:checked+.knob{background:var(--accent);border-color:var(--accent);}
.toggle input:checked+.knob::before{transform:translateX(18px);background:var(--accent-on);}
.checkbox{width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:4px;display:inline-grid;place-items:center;cursor:pointer;flex-shrink:0;background:var(--surface-1);}
.checkbox.checked{background:var(--accent);border-color:var(--accent);}
.checkbox.checked::after{content:'';width:9px;height:5px;border-left:2px solid var(--accent-on);border-bottom:2px solid var(--accent-on);transform:rotate(-45deg) translate(1px,-1px);}

/* ── Cards / lists / badges ── */
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);}
.card.padded{padding:14px;}
.section-title{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin:18px 0 8px;}
.section-title:first-child{margin-top:0;}
.list{display:flex;flex-direction:column;}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border-soft);min-height:44px;}
.list-item:last-child{border-bottom:0;}
.list-item.tap{cursor:pointer;transition:background var(--t) var(--ease);}
.list-item.tap:hover{background:var(--surface-2);}
.kbd{display:inline-block;padding:1px 6px;font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;background:var(--surface-2);color:var(--text-2);line-height:1.5;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);white-space:nowrap;}
.badge.accent{color:var(--accent-text);border-color:transparent;background:var(--accent-soft);}

/* ── Status chips — the 7-state language ── */
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 6px;border-radius:var(--r-pill);
  font-size:11px;font-weight:600;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap;}
.st svg{width:15px;height:15px;}
.st.running{color:var(--ok);background:var(--ok-soft);}
.st.done{color:var(--text-2);background:var(--surface-2);border-color:var(--border);}
.st.error{color:var(--danger);background:var(--danger-soft);}
.st.killing{color:var(--warn);background:var(--warn-soft);}
.st.degraded{color:var(--warn);background:transparent;border-color:color-mix(in oklab,var(--warn) 40%,transparent);}
.st.disconnected,.st.unreachable{color:var(--text-3);background:var(--surface-2);border-color:var(--border);}
.livebars{display:inline-flex;align-items:flex-end;gap:2px;height:12px;width:15px;padding:0 1px;}
.livebars i{width:3px;background:currentColor;border-radius:1px;animation:lb 1s var(--ease) infinite;}
.livebars i:nth-child(1){height:60%;animation-delay:0s;}
.livebars i:nth-child(2){height:100%;animation-delay:.15s;}
.livebars i:nth-child(3){height:40%;animation-delay:.3s;}
@keyframes lb{0%,100%{transform:scaleY(.5);}50%{transform:scaleY(1);}}
.spin{animation:spin 1.2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Elevation: modal / sheet / toast ── */
.modal-backdrop{position:fixed;inset:0;background:var(--scrim);z-index:60;display:grid;place-items:center;padding:16px;animation:fade var(--t) var(--ease);}
@keyframes fade{from{opacity:0;}}
.modal{background:var(--overlay);border:1px solid var(--border);border-radius:var(--r-lg);width:min(560px,100%);
  max-height:calc(100dvh - 32px);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-3);animation:pop var(--t-slow) var(--ease);}
.modal.lg{width:min(800px,100%);} .modal.xl{width:min(1100px,100%);}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0;}}
.modal-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-header h2{margin:0;font-size:15px;font-weight:600;}
.modal-body{padding:16px;overflow:auto;min-height:0;flex:1 1 auto;display:flex;flex-direction:column;gap:12px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
.sheet-backdrop{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fade var(--t) var(--ease);}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--overlay);border-top:1px solid var(--border);
  border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:61;max-height:85dvh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-bot);box-shadow:var(--sh-3);animation:sheetin var(--t-slow) var(--ease-sheet);}
@keyframes sheetin{from{transform:translateY(100%);}}
.sheet .grab{width:36px;height:4px;background:var(--text-4);border-radius:4px;margin:8px auto 4px;flex:none;}
.sheet-body{overflow:auto;padding:8px 14px 16px;}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 12px + var(--safe-bot));z-index:100;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;width:min(420px,calc(100% - 24px));}
@media (min-width:768px){.toasts{bottom:24px;left:auto;right:24px;transform:none;}}
.toast{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:var(--sh-4);pointer-events:auto;animation:pop var(--t-slow) var(--ease);}
.toast svg{width:16px;height:16px;}
.toast.success svg{color:var(--ok);} .toast.error svg{color:var(--danger);} .toast.info svg{color:var(--info);} .toast.warn svg{color:var(--warn);}

/* ── Empty / skeleton ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 24px;color:var(--text-2);gap:10px;min-height:180px;}
.empty svg{width:32px;height:32px;color:var(--text-3);}
.empty h3{margin:0;font-size:15px;color:var(--text);font-weight:600;}
.empty p{margin:0;font-size:13px;max-width:320px;}
.skel{background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:skel 1.4s linear infinite;border-radius:var(--r-sm);}
@keyframes skel{from{background-position:200% 0;}to{background-position:-200% 0;}}

/* ── Log viewport ── */
.logview{font-family:var(--mono);font-size:12px;line-height:1.55;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:auto;white-space:pre-wrap;word-break:break-word;padding:10px 12px;position:relative;}
.logview mark{background:var(--accent-soft);color:var(--accent-text);border-radius:2px;padding:0 1px;}

/* Modal stack — Esc closes topmost, focus trap + return */
const _mstack=[];
function openModal(html,{size='',dismissible=true}={}){
  const prev=document.activeElement;
  const bd=document.createElement('div');bd.className='modal-backdrop';bd.style.zIndex=60+_mstack.length*2;
  bd.innerHTML='<div class="modal '+size+'" role="dialog" aria-modal="true">'+html+'</div>';
  const m=bd.firstElementChild;
  if(dismissible)bd.addEventListener('click',e=>{if(e.target===bd)closeModal(bd);});
  bd._prev=prev;_mstack.push(bd);document.getElementById('overlay-root').appendChild(bd);
  const f=m.querySelector('input,button,textarea,select');if(f)f.focus();
  m.addEventListener('keydown',e=>{ if(e.key!=='Tab')return;
    const els=[...m.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled&&x.offsetParent);
    if(!els.length)return;const first=els[0],last=els[els.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}});
  return bd;}
function closeModal(bd){bd=bd||_mstack[_mstack.length-1];if(!bd)return;_mstack.splice(_mstack.indexOf(bd),1);
  const p=bd._prev;bd.remove();if(p&&p.focus)p.focus();}
function openSheet(html){const prev=document.activeElement;
  const bd=document.createElement('div');bd.className='sheet-backdrop';bd.style.zIndex=60+_mstack.length*2;
  bd.addEventListener('click',()=>closeModal(bd));
  const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.style.zIndex=61+_mstack.length*2;
  sh.innerHTML='<div class="grab" aria-hidden="true"></div>'+html;
  bd._prev=prev;bd._sheet=sh;_mstack.push(bd);
  const root=document.getElementById('overlay-root');root.appendChild(bd);root.appendChild(sh);
  const origRemove=bd.remove.bind(bd);bd.remove=()=>{origRemove();sh.remove();};
  return bd;}

function confirmModal({title,body,okLabel='Confirm',danger=false,machine=true}){
  return new Promise(res=>{

      '<p style="margin:0;font-size:13px;color:var(--text-2)">'+body+'</p></div>'+
      '<div class="modal-footer"><button class="btn" data-a="no">Cancel</button><button class="btn primary'+(danger?' danger':'')+'" data-a="ok">'+okLabel+'</button></div>');
    bd.querySelector('[data-a=no]').onclick=()=>{closeModal(bd);res(false);};
    bd.querySelector('[data-a=ok]').onclick=()=>{closeModal(bd);res(true);};});}
/* ── Machine identity ── */
const MACHINES={
  desktop:{key:'desktop',name:'helios',plat:'Windows 11 · desktop',short:'Windows',pat:'pat-dots',state:'online',ms:23,icon:'monitor'},
  vps:{key:'vps',name:'verdant',plat:'Ubuntu 24.04 · VPS',short:'Linux',pat:'pat-grid',state:'online',ms:81,icon:'server'},
  atlas:{key:'atlas',name:'atlas',plat:'Debian 12 · homelab',short:'Linux',pat:'pat-grid',state:'unreachable',last:'2h ago',icon:'server'},
  mira:{key:'mira',name:'mira',plat:'Windows 11 · laptop',short:'Windows',pat:'pat-dots',state:'signedout',icon:'monitor'},
};
let CUR=localStorage.getItem('proto-machine')||'desktop';
if(!MACHINES[CUR]||MACHINES[CUR].state!=='online')CUR='desktop';
function applyPrefs(){
  document.documentElement.dataset.theme=localStorage.getItem('proto-theme')||'dark';
  document.documentElement.dataset.accent=localStorage.getItem('proto-accent')||'amber';
  document.documentElement.dataset.machine=CUR;
  const M=MACHINES[CUR];
  document.getElementById('m-name').textContent=M.name;
  document.getElementById('m-plat').textContent=M.short;
  const sw=document.getElementById('m-swatch');sw.className='swatch '+M.pat;
  document.getElementById('conn-ms').textContent=M.ms+'ms';
}
function machineRow(M){
  const st=M.state==='online'?stChip('running','online · '+M.ms+'ms'):M.state==='unreachable'?stChip('unreachable','unreachable · seen '+M.last):'<span class="st disconnected">'+I('lock',14)+'not signed in</span>';
  return '<button class="list-item tap" data-m="'+M.key+'" style="width:100%;text-align:left;border-radius:var(--r)'+(M.key===CUR?';background:color-mix(in oklab,var(--machine-ink) 8%,transparent)':'')+'">'+
    '<span class="swatch '+M.pat+'" style="width:26px;height:26px;border-radius:6px;border:1px solid var(--machine-ink);position:relative;overflow:hidden;flex-shrink:0"></span>'+
    '<span class="col" style="gap:1px;flex:1;min-width:0"><span class="row" style="gap:6px"><span class="mono" style="font-size:13px;font-weight:600">'+M.name+'</span>'+(M.key===CUR?'<span class="badge accent">current</span>':'')+'</span><span class="subtle">'+M.plat+'</span></span>'+st+'</button>';
}
function openSwitcher(){
  const html='<div class="sheet-body"><div class="section-title">Machines</div><div class="col" style="gap:4px">'+
    Object.values(MACHINES).map(machineRow).join('')+'</div>'+
    '<p class="subtle" style="margin:10px 2px 0">Each machine keeps its own pattern and color everywhere — header, background, confirmations, notifications.</p></div>';
  const bd=openSheet(html);
  bd._sheet.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const M=MACHINES[b.dataset.m];
    if(M.state==='online'){CUR=M.key;localStorage.setItem('proto-machine',CUR);closeModal(bd);applyPrefs();toast('info','Switched to '+M.name);}
    else if(M.state==='signedout'){closeModal(bd);openSignIn(M);}
    else{closeModal(bd);openUnreachable(M);}
  });
}
function openSignIn(M){
  const bd=openModal('<div class="modal-header"><span class="swatch '+M.pat+'" style="width:20px;height:20px;border-radius:5px;border:1px solid var(--machine-ink);position:relative;overflow:hidden"></span><h2 style="font-family:var(--mono)">'+M.name+'</h2><span class="subtle">'+M.plat+'</span></div>'+
    '<div class="modal-body"><p style="margin:0;font-size:13px;color:var(--text-2)">You\'re not signed in to this machine yet. Its password is separate from other machines.</p>'+
    '<div class="field"><label for="si-pw">Password for '+M.name+'</label><div class="row"><input id="si-pw" class="input" type="password" autocomplete="current-password"><button class="btn icon" aria-label="Show password">'+I('eye',16)+'</button></div></div>'+
    '<label class="row" style="gap:8px;font-size:13px;color:var(--text-2);cursor:pointer"><span class="checkbox"></span>Trust this device for 60 days</label></div>'+
    '<div class="modal-footer"><button class="btn" data-a="no">Cancel</button><button class="btn primary">Sign in</button></div>');
  bd.querySelector('[data-a=no]').onclick=()=>closeModal(bd);
  bd.querySelector('.checkbox').onclick=e=>e.currentTarget.classList.toggle('checked');
  bd.querySelector('.btn.primary').onclick=()=>{closeModal(bd);toast('error','Sign-in is mocked in this prototype');};
}
function openUnreachable(M){
  const bd=openModal('<div class="modal-body" style="align-items:center;text-align:center;padding:36px 24px;gap:12px">'+
    '<span class="swatch '+M.pat+'" style="width:44px;height:44px;border-radius:10px;border:1px solid var(--machine-ink);position:relative;overflow:hidden;opacity:.65"></span>'+
    '<div>'+stChip('unreachable','unreachable')+'</div>'+
    '<h3 style="margin:0;font-size:16px"><span class="mono">'+M.name+'</span> isn\'t responding</h3>'+
    '<p style="margin:0;font-size:13px;color:var(--text-2);max-width:300px">Last seen '+M.last+' over Tailscale. The machine may be off, asleep, or off the tailnet. Nothing you do here can affect it until it\'s back.</p>'+
    '<div class="row" style="margin-top:6px"><button class="btn" data-a="no">Close</button><button class="btn primary">'+I('refresh',15)+'Retry now</button></div></div>');
  bd.querySelector('[data-a=no]').onclick=()=>closeModal(bd);
  bd.querySelector('.btn.primary').onclick=()=>{toast('warn','Still unreachable — retrying in background');closeModal(bd);};
}
/* Tabbar icons + active */
document.querySelectorAll('.tabbar a').forEach(a=>{
  a.insertAdjacentHTML('afterbegin',I(a.dataset.icon,20));
  const lbl=document.createElement('span');lbl.textContent=a.textContent.replace(/^\s+/,'').trim()||a.dataset.tab;
  a.innerHTML=I(a.dataset.icon,20);a.appendChild(lbl);
  if(a.dataset.tab==='console'){a.classList.add('active');a.setAttribute('aria-current','page');}
});
document.getElementById('machine-chip').onclick=openSwitcher;
document.getElementById('help-btn').innerHTML=I('help',18);
document.getElementById('help-btn').onclick=()=>{
  const bd=openModal('<div class="modal-header"><h2>Request a change</h2></div><div class="modal-body">'+
  '<p style="margin:0;font-size:13px;color:var(--text-2)">Describe what you want changed about Supervisor. This opens an interactive Claude session in the app\'s own repo on <span class="mono" style="color:var(--machine-ink)">'+MACHINES[CUR].name+'</span> with your request pre-filled, and takes you to its console tab.</p>'+
  '<div class="field"><label for="mx-req">Request</label><textarea id="mx-req" class="textarea" placeholder="e.g. Add a sixth accent color"></textarea></div></div>'+
  '<div class="modal-footer"><span class="subtle" style="margin-right:auto"><span class="kbd">?</span> opens this anywhere</span><button class="btn" data-a="no">Cancel</button><button class="btn primary">'+I('send',15)+'Start session</button></div>');
  bd.querySelector('[data-a=no]').onclick=()=>closeModal(bd);
  bd.querySelector('.btn.primary').onclick=()=>{closeModal(bd);toast('success','Handed off to Claude — opening Console');};
};
/* g-chord nav + ? */
let _g=0;
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='?'){document.getElementById('help-btn').click();return;}
  if(e.key==='g'){_g=Date.now();return;}
  if(Date.now()-_g<800){const map={s:'sessions',f:'files',c:'console',p:'processes',y:'system',t:'settings'};
    if(map[e.key])location.href=map[e.key]+'.html';}
  _g=0;});
applyPrefs();
</script>

<script>
document.querySelector('.app-main').style.display='flex';
document.querySelector('.app-main').style.flexDirection='column';
/* Tabs */
const TABS=[{n:'supervisor',alive:true,pty:true},{n:'deploy',alive:true,pty:false},{n:'scratch',alive:false,pty:true}];
let curTab=1;
function renderTabs(){
  document.getElementById('ttabs').innerHTML=TABS.map((t,i)=>
   '<span class="term-tab'+(i===curTab?' active':'')+(t.alive?'':' dead')+'" data-t="'+i+'" role="tab" aria-selected="'+(i===curTab)+'"><span class="d"></span>'+t.n+
   (t.pty?'':'<span class="st degraded" style="height:18px;padding:0 6px;font-size:9.5px">'+I('warning',11)+'no PTY</span>')+
   '<button class="x" data-x="'+i+'" aria-label="Close '+t.n+'">'+I('x',13)+'</button>'+
   '<button class="x" data-r="'+i+'" aria-label="Rename '+t.n+'">'+I('edit',12)+'</button></span>').join('')+
   '<button class="btn ghost sm" id="t-new" style="flex-shrink:0">'+I('plus',15)+'New shell</button>';
  document.getElementById('degstrip').style.display=TABS[curTab].pty?'none':'flex';
  document.getElementById('con').classList.toggle('deg',!TABS[curTab].pty);
  document.getElementById('ttabs').querySelectorAll('[data-t]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-x],[data-r]'))return;curTab=+el.dataset.t;renderTabs();});
  document.getElementById('ttabs').querySelectorAll('[data-x]').forEach(el=>el.onclick=()=>confirmModal({title:'Close shell?',body:'<span class="mono">'+TABS[el.dataset.x].n+'</span> and its scrollback will be discarded.',okLabel:'Close shell',danger:true,machine:false}).then(ok=>{if(ok){TABS.splice(el.dataset.x,1);curTab=Math.min(curTab,TABS.length-1);renderTabs();}}));
  document.getElementById('ttabs').querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{
    const bd=openModal('<div class="modal-header"><h2>Rename shell</h2></div><div class="modal-body"><div class="field"><label>Name</label><input class="input" value="'+TABS[el.dataset.r].n+'"></div></div>'+
    '<div class="modal-footer"><button class="btn" data-a="no">Cancel</button><button class="btn primary" data-a="ok">Rename</button></div>');
    bd.querySelector('[data-a=no]').onclick=()=>closeModal(bd);
    bd.querySelector('[data-a=ok]').onclick=()=>{TABS[el.dataset.r].n=bd.querySelector('input').value;closeModal(bd);renderTabs();};});
  const tn=document.getElementById('t-new');if(tn)tn.onclick=()=>{TABS.push({n:'shell '+(TABS.length+1),alive:true,pty:true});curTab=TABS.length-1;renderTabs();};
}
renderTabs();
/* Terminal mock */
const term=document.getElementById('term');
const SCROLLBACK=['joel@verdant:~/apps/acme$ git pull','Updating 8f31c2e..73a8b13','Fast-forward',' server/lib/metrics.js | 41 ++++++++---',' web/styles.css        | 118 +++++++++++++------------',' 2 files changed, 96 insertions(+), 63 deletions(-)','joel@verdant:~/apps/acme$ pm2 restart acme-api','[PM2] Applying action restartProcessId on app [acme-api](ids: [ 0 ])','[PM2] [acme-api](0) ✓','joel@verdant:~/apps/acme$ pm2 logs acme-api --lines 3','0|acme-api | 18:41:07 GET /api/health 200 3ms','0|acme-api | 18:41:22 POST /api/webhooks/stripe 200 41ms','0|acme-api | 18:42:00 GET /api/orders?after=2026-08-01 200 88ms'];
term.textContent=SCROLLBACK.join('\n')+'\n';
const cur=document.createElement('span');
const prompt=document.createElement('span');prompt.textContent='joel@verdant:~/apps/acme$ ';
const typed=document.createElement('span');
cur.className='cursor';
term.appendChild(prompt);term.appendChild(typed);term.appendChild(cur);
term.scrollTop=term.scrollHeight;
let ctrlArmed=false;
function feedKey(label){
  if(ctrlArmed){typed.textContent+='^'+label.toUpperCase();disarm();return;}
  if(label==='Enter'){term.insertBefore(document.createTextNode(prompt.textContent+typed.textContent+'\n'),prompt);typed.textContent='';}
  else if(label==='Esc'||label==='Tab')typed.textContent+='';
  else typed.textContent+=label;
  term.scrollTop=term.scrollHeight;}
/* Quick keys — 6 kinds */
const QK=[
 {k:'esc',label:'Esc',t:'key'},{k:'tab',label:'Tab',t:'key'},
 {k:'ctrl',label:'Ctrl',t:'ctrl-toggle'},
 {k:'up',label:'↑',t:'key'},{k:'down',label:'↓',t:'key'},
 {k:'pipe',label:'|',t:'key'},{k:'tilde',label:'~',t:'key'},{k:'slash',label:'/',t:'key'},
 {k:'cd',label:'cd ~/apps/acme',t:'cd'},
 {k:'script',label:'deploy.sh',t:'script'},
 {k:'claude',label:'Send to Claude',t:'send-claude'},
 {k:'paste',label:'Paste',t:'paste'},
];
const qkIcon={cd:'folder',script:'file-text','send-claude':'rocket',paste:'copy'};
function renderQK(){
  document.getElementById('qkrow').innerHTML=QK.map((q,i)=>
   '<button class="qk'+(q.t==='ctrl-toggle'&&ctrlArmed?' armed':'')+(q.t!=='key'&&q.t!=='ctrl-toggle'?' wide':'')+'" data-q="'+i+'" aria-label="'+q.label+(q.t==='ctrl-toggle'?(ctrlArmed?' — armed, next key gets Ctrl':' — tap to arm Ctrl'):'')+'" aria-pressed="'+(q.t==='ctrl-toggle'?ctrlArmed:'')+'">'+
   (qkIcon[q.t]?I(qkIcon[q.t],14):'')+q.label+'</button>').join('')+
   '<button class="qk" id="qk-add" aria-label="Add quick key">'+I('plus',16)+'</button>';
  document.querySelectorAll('[data-q]').forEach(b=>{
    const q=QK[b.dataset.q];
    b.onclick=()=>{
      if(q.t==='ctrl-toggle'){ctrlArmed=!ctrlArmed;renderQK();return;}
      if(q.t==='key')feedKey(q.label==='↑'?'':q.label.length===1?q.label:q.label==='Esc'?'Esc':'');
      if(q.t==='cd'){typed.textContent='cd ~/apps/acme';feedKey('Enter');}
      if(q.t==='script'){term.insertBefore(document.createTextNode(prompt.textContent+'./deploy.sh\nBuilding… ok\nSyncing to verdant… ok\nDeployed 73a8b13 in 41s\n'),prompt);term.scrollTop=term.scrollHeight;}
      if(q.t==='send-claude'){toast('success','Last 2000 chars sent — opening a Claude session pre-filled');}
      if(q.t==='paste'){typed.textContent+='npm run lint';}
      if(ctrlArmed&&q.t==='key')disarm();
    };
    /* long-press = edit/remove, same menu on right-click for pointer+keyboard parity */
    let t;b.onpointerdown=()=>{t=setTimeout(()=>qkMenu(q),500);};
    b.onpointerup=b.onpointerleave=()=>clearTimeout(t);
    b.oncontextmenu=e=>{e.preventDefault();qkMenu(q);};
  });
  document.getElementById('qk-add').onclick=openKeyPicker;
}
function disarm(){ctrlArmed=false;renderQK();}
function qkMenu(q){
  const bd=openSheet('<div class="sheet-body"><div class="section-title">'+q.label+' · '+q.t+'</div><div class="col" style="gap:1px">'+
  '<button class="side-item">'+I('edit',15)+'Edit key</button><button class="side-item" style="color:var(--danger)">'+I('trash',15)+'Remove key</button></div>'+
  '<p class="subtle" style="margin:10px 10px 0">Also opened by long-press or right-click on the key.</p></div>');
  bd._sheet.querySelectorAll('.side-item').forEach(x=>x.onclick=()=>closeModal(bd));
}
function openKeyPicker(){
  const PRESETGRID=['Esc','Tab','Ctrl','←','↓','↑','→','|','~','/','\\','"','\'','$','&','*','#','^C','^D','^L','^R','Claude','Paste'];
  const bd=openModal('<div class="modal-header"><h2>Add quick key</h2></div>'+
  '<div class="modal-body" style="gap:10px"><div class="seg" role="tablist" style="align-self:flex-start"><button class="active">Presets</button><button>cd path</button><button>Script</button></div>'+
  '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px">'+
   PRESETGRID.map(k=>'<button class="qk" style="width:100%">'+k+'</button>').join('')+'</div>'+
  '<p class="subtle" style="margin:0">Keys sync across your devices. cd paths and scripts get their own builder in the next tabs.</p></div>'+
  '<div class="modal-footer"><button class="btn" data-a="no">Cancel</button><button class="btn primary" data-a="ok">Add key</button></div>');
  bd.querySelector('[data-a=no]').onclick=()=>closeModal(bd);
  bd.querySelector('[data-a=ok]').onclick=()=>{closeModal(bd);toast('success','Key added and synced');};
}
renderQK();
document.getElementById('deg-why').onclick=()=>openModal((()=>{return '<div class="modal-header"><h2>Degraded shell</h2></div><div class="modal-body"><p style="margin:0;font-size:13px;color:var(--text-2)">node-pty isn\'t installed on <span class="mono" style="color:var(--machine-ink)">verdant</span>, so this shell runs through a plain pipe. Output still streams and commands still run, but there is no color, no terminal resize, and interactive prompts (like <span class="mono">y/n</span>) may not render until you press Enter.</p><p style="margin:0;font-size:13px;color:var(--text-2)">To fix: <span class="mono">npm rebuild node-pty</span> on the host, then restart Supervisor.</p></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Close</button></div>';})());
</script>

</body>
