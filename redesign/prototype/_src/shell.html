<div class="app">
  <header class="app-header">
    <button class="machine-chip" id="machine-chip" aria-label="Switch machine" aria-haspopup="dialog">
      <span class="swatch" id="m-swatch"></span>
      <span style="display:flex;flex-direction:column;align-items:flex-start;min-width:0">
        <span class="mname" id="m-name">helios</span>
        <span class="mplat" id="m-plat">Windows</span>
      </span>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <h1 class="app-title" style="min-width:0"><span class="truncate">{{TITLE}}</span></h1>
    <div class="header-actions">
      <span class="conn" id="conn" role="status" aria-label="Connection: ok, 23 milliseconds"><span class="d"></span><span id="conn-ms">23ms</span></span>
      <button class="btn ghost icon" id="help-btn" aria-label="Request a change"></button>
    </div>
  </header>
  <main class="app-main" id="main">
{{CONTENT}}
  </main>
  <nav class="tabbar" aria-label="Primary">
    <a href="sessions.html" data-tab="sessions" data-icon="rocket">Sessions</a>
    <a href="files.html" data-tab="files" data-icon="folder">Files</a>
    <a href="console.html" data-tab="console" data-icon="terminal">Console</a>
    <a href="processes.html" data-tab="processes" data-icon="layers">Processes</a>
    <a href="system.html" data-tab="system" data-icon="cpu">System</a>
    <a href="settings.html" data-tab="settings" data-icon="settings">Settings</a>

</div>

function I(n,s=18,sw=1.5){return '<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IPATHS[n]||'')+'</svg>';}
/* Status chip builder */
function stChip(state,word){
  const g={running:'<span class="livebars" aria-hidden="true"><i></i><i></i><i></i></span>',
    done:I('square',15),error:I('x',15),killing:'<span class="spin" style="display:inline-flex">'+I('st-killing',15)+'</span>',
    degraded:I('warning',15),disconnected:I('st-cap',15),unreachable:I('wave-broken',15)};
  return '<span class="st '+state+'">'+(g[state]||'')+(word||state)+'</span>';
}
/* Toast */
function toast(kind,msg){const t=document.createElement('div');t.className='toast '+kind;
  t.innerHTML=I(kind==='success'?'check':kind==='error'?'x':kind==='warn'?'warning':'info',16)+'<span>'+msg+'</span><button class="btn ghost sm icon" aria-label="Dismiss" style="margin-left:auto">'+I('x',14)+'</button>';
  t.querySelector('button').onclick=()=>t.remove();document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}
/* Modal stack — Esc closes topmost, focus trap + return */
const _mstack=[];
function openModal(html,{size='',dismissible=true}={}){
  const prev=document.activeElement;
  const bd=document.createElement('div');bd.className='modal-backdrop';bd.style.zIndex=60+_mstack.length*2;
  bd.innerHTML='<div class="modal '+size+'" role="dialog" aria-modal="true">'+html+'</div>';
  const m=bd.firstElementChild;
  if(dismissible)bd.addEventListener('click',e=>{if(e.target===bd)closeModal(bd);});
  bd._prev=prev;_mstack.push(bd);document.getElementById('overlay-root').appendChild(bd);
  const f=m.querySelector('input,button,textarea,select');if(f)f.focus();
  m.addEventListener('keydown',e=>{ if(e.key!=='Tab')return;
    const els=[...m.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled&&x.offsetParent);
    if(!els.length)return;const first=els[0],last=els[els.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}});
  return bd;}
function closeModal(bd){bd=bd||_mstack[_mstack.length-1];if(!bd)return;_mstack.splice(_mstack.indexOf(bd),1);
  const p=bd._prev;bd.remove();if(p&&p.focus)p.focus();}
function openSheet(html){const prev=document.activeElement;
  const bd=document.createElement('div');bd.className='sheet-backdrop';bd.style.zIndex=60+_mstack.length*2;
  bd.addEventListener('click',()=>closeModal(bd));
  const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.style.zIndex=61+_mstack.length*2;
  sh.innerHTML='<div class="grab" aria-hidden="true"></div>'+html;
  bd._prev=prev;bd._sheet=sh;_mstack.push(bd);
  const root=document.getElementById('overlay-root');root.appendChild(bd);root.appendChild(sh);
  const origRemove=bd.remove.bind(bd);bd.remove=()=>{origRemove();sh.remove();};
  return bd;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&_mstack.length){closeModal();e.preventDefault();}});
function confirmModal({title,body,okLabel='Confirm',danger=false,machine=true}){
  return new Promise(res=>{
    const M=MACHINES[CUR];
    const bd=openModal('<div class="modal-header"><h2>'+title+'</h2></div>'+
      '<div class="modal-body">'+(machine?'<div class="row" style="gap:8px;padding:8px 10px;border:1px solid color-mix(in oklab,var(--machine-ink) 40%,var(--border));border-radius:var(--r);background:color-mix(in oklab,var(--machine-ink) 8%,transparent)"><span class="swatch '+M.pat+'" style="width:18px;height:18px;border-radius:4px;border:1px solid var(--machine-ink);position:relative;overflow:hidden;display:inline-block"></span><span class="mono" style="font-size:12px;font-weight:600;color:var(--machine-ink)">'+M.name+'</span><span class="subtle">'+M.plat+'</span></div>':'')+
      '<p style="margin:0;font-size:13px;color:var(--text-2)">'+body+'</p></div>'+
      '<div class="modal-footer"><button class="btn" data-a="no">Cancel</button><button class="btn primary'+(danger?' danger':'')+'" data-a="ok">'+okLabel+'</button></div>');
    bd.querySelector('[data-a=no]').onclick=()=>{closeModal(bd);res(false);};
    bd.querySelector('[data-a=ok]').onclick=()=>{closeModal(bd);res(true);};});}
/* ── Machine identity ── */
const MACHINES={
  desktop:{key:'desktop',name:'helios',plat:'Windows 11 · desktop',short:'Windows',pat:'pat-dots',state:'online',ms:23,icon:'monitor'},
  vps:{key:'vps',name:'verdant',plat:'Ubuntu 24.04 · VPS',short:'Linux',pat:'pat-grid',state:'online',ms:81,icon:'server'},
  atlas:{key:'atlas',name:'atlas',plat:'Debian 12 · homelab',short:'Linux',pat:'pat-grid',state:'unreachable',last:'2h ago',icon:'server'},
  mira:{key:'mira',name:'mira',plat:'Windows 11 · laptop',short:'Windows',pat:'pat-dots',state:'signedout',icon:'monitor'},
};
let CUR=localStorage.getItem('proto-machine')||'desktop';
if(!MACHINES[CUR]||MACHINES[CUR].state!=='online')CUR='desktop';
function applyPrefs(){
  document.documentElement.dataset.theme=localStorage.getItem('proto-theme')||'dark';
  document.documentElement.dataset.accent=localStorage.getItem('proto-accent')||'amber';
  document.documentElement.dataset.machine=CUR;
  const M=MACHINES[CUR];
  document.getElementById('m-name').textContent=M.name;
  document.getElementById('m-plat').textContent=M.short;
  const sw=document.getElementById('m-swatch');sw.className='swatch '+M.pat;
  document.getElementById('conn-ms').textContent=M.ms+'ms';
}
function machineRow(M){
  const st=M.state==='online'?stChip('running','online · '+M.ms+'ms'):M.state==='unreachable'?stChip('unreachable','unreachable · seen '+M.last):'<span class="st disconnected">'+I('lock',14)+'not signed in</span>';
  return '<button class="list-item tap" data-m="'+M.key+'" style="width:100%;text-align:left;border-radius:var(--r)'+(M.key===CUR?';background:color-mix(in oklab,var(--machine-ink) 8%,transparent)':'')+'">'+
    '<span class="swatch '+M.pat+'" style="width:26px;height:26px;border-radius:6px;border:1px solid var(--machine-ink);position:relative;overflow:hidden;flex-shrink:0"></span>'+
    '<span class="col" style="gap:1px;flex:1;min-width:0"><span class="row" style="gap:6px"><span class="mono" style="font-size:13px;font-weight:600">'+M.name+'</span>'+(M.key===CUR?'<span class="badge accent">current</span>':'')+'</span><span class="subtle">'+M.plat+'</span></span>'+st+'</button>';
}
function openSwitcher(){
  const html='<div class="sheet-body"><div class="section-title">Machines</div><div class="col" style="gap:4px">'+
    Object.values(MACHINES).map(machineRow).join('')+'</div>'+
    '<p class="subtle" style="margin:10px 2px 0">Each machine keeps its own pattern and color everywhere — header, background, confirmations, notifications.</p></div>';
  const bd=openSheet(html);
  bd._sheet.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const M=MACHINES[b.dataset.m];
    if(M.state==='online'){CUR=M.key;localStorage.setItem('proto-machine',CUR);closeModal(bd);applyPrefs();toast('info','Switched to '+M.name);}
    else if(M.state==='signedout'){closeModal(bd);openSignIn(M);}
    else{closeModal(bd);openUnreachable(M);}
  });
}
function openSignIn(M){
  const bd=openModal('<div class="modal-header"><span class="swatch '+M.pat+'" style="width:20px;height:20px;border-radius:5px;border:1px solid var(--machine-ink);position:relative;overflow:hidden"></span><h2 style="font-family:var(--mono)">'+M.name+'</h2><span class="subtle">'+M.plat+'</span></div>'+
    '<div class="modal-body"><p style="margin:0;font-size:13px;color:var(--text-2)">You\'re not signed in to this machine yet. Its password is separate from other machines.</p>'+
    '<div class="field"><label for="si-pw">Password for '+M.name+'</label><div class="row"><input id="si-pw" class="input" type="password" autocomplete="current-password"><button class="btn icon" aria-label="Show password">'+I('eye',16)+'</button></div></div>'+
    '<label class="row" style="gap:8px;font-size:13px;color:var(--text-2);cursor:pointer"><span class="checkbox"></span>Trust this device for 60 days</label></div>'+
    '<div class="modal-footer"><button class="btn" data-a="no">Cancel</button><button class="btn primary">Sign in</button></div>');
  bd.querySelector('[data-a=no]').onclick=()=>closeModal(bd);
  bd.querySelector('.checkbox').onclick=e=>e.currentTarget.classList.toggle('checked');
  bd.querySelector('.btn.primary').onclick=()=>{closeModal(bd);toast('error','Sign-in is mocked in this prototype');};
}
function openUnreachable(M){
  const bd=openModal('<div class="modal-body" style="align-items:center;text-align:center;padding:36px 24px;gap:12px">'+
    '<span class="swatch '+M.pat+'" style="width:44px;height:44px;border-radius:10px;border:1px solid var(--machine-ink);position:relative;overflow:hidden;opacity:.65"></span>'+
    '<div>'+stChip('unreachable','unreachable')+'</div>'+
    '<h3 style="margin:0;font-size:16px"><span class="mono">'+M.name+'</span> isn\'t responding</h3>'+
    '<p style="margin:0;font-size:13px;color:var(--text-2);max-width:300px">Last seen '+M.last+' over Tailscale. The machine may be off, asleep, or off the tailnet. Nothing you do here can affect it until it\'s back.</p>'+
    '<div class="row" style="margin-top:6px"><button class="btn" data-a="no">Close</button><button class="btn primary">'+I('refresh',15)+'Retry now</button></div></div>');
  bd.querySelector('[data-a=no]').onclick=()=>closeModal(bd);
  bd.querySelector('.btn.primary').onclick=()=>{toast('warn','Still unreachable — retrying in background');closeModal(bd);};
}
/* Tabbar icons + active */
document.querySelectorAll('.tabbar a').forEach(a=>{
  a.insertAdjacentHTML('afterbegin',I(a.dataset.icon,20));
  const lbl=document.createElement('span');lbl.textContent=a.textContent.replace(/^\s+/,'').trim()||a.dataset.tab;
  a.innerHTML=I(a.dataset.icon,20);a.appendChild(lbl);
  if(a.dataset.tab==='{{ACTIVE}}'){a.classList.add('active');a.setAttribute('aria-current','page');}
});
document.getElementById('machine-chip').onclick=openSwitcher;
document.getElementById('help-btn').innerHTML=I('help',18);
document.getElementById('help-btn').onclick=()=>{
  const bd=openModal('<div class="modal-header"><h2>Request a change</h2></div><div class="modal-body">'+
  '<p style="margin:0;font-size:13px;color:var(--text-2)">Describe what you want changed about Supervisor. This opens an interactive Claude session in the app\'s own repo on <span class="mono" style="color:var(--machine-ink)">'+MACHINES[CUR].name+'</span> with your request pre-filled, and takes you to its console tab.</p>'+
  '<div class="field"><label for="mx-req">Request</label><textarea id="mx-req" class="textarea" placeholder="e.g. Add a sixth accent color"></textarea></div></div>'+
  '<div class="modal-footer"><span class="subtle" style="margin-right:auto"><span class="kbd">?</span> opens this anywhere</span><button class="btn" data-a="no">Cancel</button><button class="btn primary">'+I('send',15)+'Start session</button></div>');
  bd.querySelector('[data-a=no]').onclick=()=>closeModal(bd);
  bd.querySelector('.btn.primary').onclick=()=>{closeModal(bd);toast('success','Handed off to Claude — opening Console');};
};
/* g-chord nav + ? */
let _g=0;
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='?'){document.getElementById('help-btn').click();return;}
  if(e.key==='g'){_g=Date.now();return;}
  if(Date.now()-_g<800){const map={s:'sessions',f:'files',c:'console',p:'processes',y:'system',t:'settings'};
    if(map[e.key])location.href=map[e.key]+'.html';}
  _g=0;});
applyPrefs();
</script>
{{PAGEJS}}
</body>
